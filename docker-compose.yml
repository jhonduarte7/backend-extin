services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fire_safety_db
    restart: always
    environment:
      POSTGRES_DB: fire_safety_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
