# ==============================================================================
# Equi-Extin Backend Application Configuration
# Sensitive credentials are strictly injected via environment variables (.env)
# ==============================================================================
server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: backend-api

  # Import environment variables from .env file if present
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  http:
    clients:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:120s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:180s}

  # PostgreSQL Database Configuration (Sensitive values injected strictly via environment variables)
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA / Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        timeout: ${AI_INIT_TIMEOUT:120s}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          timeout: ${AI_CHAT_TIMEOUT:120s}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:all-minilm}
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:all-minilm}
    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INIT_SCHEMA:false}
        dimensions: ${PGVECTOR_DIMENSIONS:384}
        distance-type: COSINE_DISTANCE
        index-type: HNSW

# Security & Seed Credentials (Variables configured in .env / environment)
app:
  security:
    seed:
      admin-password: ${APP_ADMIN_PASSWORD}
      user-password: ${APP_USER_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
    cookie:
      secure: ${COOKIE_SECURE:true}

# Cross-Origin Cookie settings (Defaulted to None and Secure for Vercel <-> Render cross-domain authentication)
cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAMESITE:None}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.extin.backend: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_BIND:TRACE}
